---
# cPanel Git deployment: copies the public website into public_html.
# The copy itself lives in scripts/deploy-site.sh, which the cron auto-deploy
# (scripts/cpanel-autodeploy.sh) runs too, so both paths ship the same files.
# Manual deploy: cPanel → Git Version Control → Manage → Pull or Deploy →
# "Deploy HEAD Commit".
deployment:
  tasks:
    - export DEPLOYPATH=/home/syphsevs/public_html/
    - /bin/bash scripts/deploy-site.sh
