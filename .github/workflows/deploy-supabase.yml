name: Deploy Supabase

# On every push to the production branch (the repository's default branch) that changes
# anything under supabase/: re-run the access tests, apply new database migrations, then
# deploy the edge functions. The website itself deploys separately, by cron on cPanel
# (scripts/cpanel-autodeploy.sh).
#
# Needs one repository secret (Settings → Secrets and variables → Actions):
#   SUPABASE_ACCESS_TOKEN  a personal access token from supabase.com/dashboard/account/tokens
# The Supabase CLI (pinned below; 3.x) reaches the database with that token, so no database
# password is needed. Commands that touch the database pass --remote: in CLI 3.x they target
# a local database unless told otherwise. Commands that change the hosted project pass --yes:
# CLI 3.x asks for confirmation before production writes and can't ask here. The confirmation
# is the merge (add a required reviewer on the production environment for a second one).

on:
  push:
    paths:
      - "supabase/**"
      - ".github/workflows/deploy-supabase.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-supabase
  cancel-in-progress: false

env:
  PROJECT_REF: pswzqwmluigojvizvfdc

jobs:
  deploy:
    name: Migrations and functions
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v5

      - name: Check the secret is set
        run: |
          [ -n "$SUPABASE_ACCESS_TOKEN" ] || { echo "::error::Add the SUPABASE_ACCESS_TOKEN repository secret."; exit 1; }

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Access tests must pass before anything deploys
        working-directory: supabase/tests
        run: |
          npm install --no-save --no-audit --no-fund @electric-sql/pglite
          node rls-test.mjs

      - uses: supabase/setup-cli@v1
        with:
          # Pinned: a new major version changed how these commands pick their database.
          # Raise it on purpose, after reading the CLI's release notes.
          version: 3.0.0

      - name: Link the project
        run: supabase link --project-ref "$PROJECT_REF"

      # The first four migrations were applied by hand in the SQL editor before automation, so
      # Supabase's migration history doesn't know about them. Recording them as applied stops
      # `db push` from running them again. Safe to repeat on every run.
      - name: Record the migrations applied by hand before automation
        run: supabase migration repair --status applied 20261001000000 20261002000000 20261103000000 20261104000000 --remote --yes

      - name: Migrations to apply
        run: supabase db push --dry-run --remote --yes

      - name: Apply migrations
        run: supabase db push --remote --yes

      - name: Deploy edge functions
        run: supabase functions deploy --use-api --yes

      # The sign-in emails (magic link, invitation and the rest) live in supabase/templates/.
      # This sends only their subjects, bodies and the link lifetime to Supabase's Management
      # API; no other auth setting is changed. The response holds the whole auth config, so it
      # is never printed: only Supabase's error message on failure.
      - name: Sign-in email templates
        run: |
          node supabase/templates/auth-emails.mjs payload > "$RUNNER_TEMP/auth-emails.json"
          status=$(curl -sS -o "$RUNNER_TEMP/auth-response.json" -w "%{http_code}" -X PATCH \
            "https://api.supabase.com/v1/projects/$PROJECT_REF/config/auth" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            --data-binary @"$RUNNER_TEMP/auth-emails.json")
          if [ "$status" -ge 300 ]; then
            node -e 'try { const r = require(process.argv[1]); console.log("::error::Email templates not updated (HTTP '"$status"'): " + (r.message || r.error || "no message")); } catch { console.log("::error::Email templates not updated (HTTP '"$status"')"); }' "$RUNNER_TEMP/auth-response.json"
            rm -f "$RUNNER_TEMP/auth-response.json"
            exit 1
          fi
          rm -f "$RUNNER_TEMP/auth-response.json"
          echo "Sign-in email templates updated."
